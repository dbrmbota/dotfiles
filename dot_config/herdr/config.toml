onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
sidebar_bg = "#16161e"
surface_dim = "#3b4261"

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "terminal"

[experimental]
pane_history = true

[keys]
goto = ""

[[keys.command]]
key = "prefix+t"
type = "pane"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "$HOME/.config/herdr/tab-picker.sh"
description = "tab picker (fzf)"
width = "90%"
height = "80%"

[ui.sound]
enabled = true
